# Setting type: String
# Default value: You have more stamina, strength and can jump higher
Athletic Description = Больше выносливости и силы, выше прыжок.

# Setting type: String
# Default value: You are able to use your mana to become incredibly strong!
Mage Description = Тратит ману, чтобы стать очень сильным!

# Setting type: String
# Default value: For each enemy you and your friends kill, you become stronger!
Reaper Description = За каждого убитого врага команда сильнее!

# Setting type: String
