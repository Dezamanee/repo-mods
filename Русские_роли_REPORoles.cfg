[Role Descriptions]

# Setting type: String
# Default value: You have more stamina and run much faster than everyone else!
Runner Description = Больше выносливости и заметно выше скорость бега!

# Setting type: String
# Default value: You walk slower but your hp is doubled!
Tank Description = Медленнее, но здоровье удвоено!

# Setting type: String
